<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>icspin · we live here and it rotates</title>
<meta name="description" content="Interactive demonstrations for arguing about the shape of the Earth. Open one, screenshare it, and let the geometry do the talking.">
<meta property="og:title" content="icspin · we live here and it rotates">
<meta property="og:description" content="Interactive demonstrations for arguing about the shape of the Earth. Open one, screenshare it, and let the geometry do the talking.">
<meta property="og:image" content="https://icspin.github.io/previews/og.png">
<meta property="og:url" content="https://icspin.github.io/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f4f1ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315181d'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%239aa4b0' stroke-width='2'/%3E%3Cline x1='9.5' y1='22.5' x2='22.5' y2='9.5' stroke='%23d9a441' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='8' r='1.8' fill='%23d9a441'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#f4f1ea; --card:#fbf8f1; --line:#e0dacb; --line2:#cfc7b2;
  --ink:#1c1f23; --dim:#5c6067; --faint:#8a8d92;
  --brass:#b8892e; --brass-ink:#8a651c;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;padding:0;color:var(--ink);
  font:16px/1.6 "Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
.wrap{max-width:680px;margin:0 auto;padding:28px 20px 40px}
header{margin:10px 0 26px}
.mark{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.mark svg{display:block;flex:none}
.mark .who{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
h1{font-size:clamp(26px,6vw,34px);line-height:1.2;font-weight:650;margin:0 0 12px;
  letter-spacing:-.01em}
h1 b{color:var(--brass-ink);font-weight:650}
.intro{color:var(--dim);font-size:17px;max-width:56ch;margin:0}
main{display:flex;flex-direction:column;gap:18px}
.card{position:relative;display:block;background:var(--card);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;
  box-shadow:0 1px 2px rgba(28,31,35,.05)}
a.card{cursor:pointer}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  a.card{transition:transform .14s ease, box-shadow .14s ease}
  a.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(28,31,35,.12)}
}
a.card:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.shot{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top;
  background:#15181d;border-bottom:1px solid var(--line)}
.card .body{padding:14px 16px 16px}
.card .top{display:flex;align-items:baseline;gap:10px}
.card .dot{width:9px;height:9px;border-radius:50%;flex:none;align-self:center}
.card .name{font-size:17px;font-weight:650;letter-spacing:.09em;text-transform:uppercase}
.card .build{margin-left:auto;font-size:13px;color:var(--brass-ink)}
.card .tagline{margin:6px 0 0;color:var(--dim);font-size:15.5px}
.card .go{margin-top:10px;font-size:14px;color:var(--brass-ink);font-weight:600}
.card.soon{opacity:.75}
.card.soon .build{color:var(--faint)}
.card.soon .shot{aspect-ratio:auto;height:0;border:0}
.note{color:var(--faint);font-size:14px}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;gap:16px;align-items:baseline;color:var(--faint);font-size:14px}
footer a{color:var(--dim)}
footer a:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#15181d"/><circle cx="16" cy="16" r="9" fill="none" stroke="#9aa4b0" stroke-width="2"/><line x1="9.5" y1="22.5" x2="22.5" y2="9.5" stroke="#d9a441" stroke-width="2.5" stroke-linecap="round"/><circle cx="24" cy="8" r="1.8" fill="#d9a441"/></svg>
      <span class="who">icspin</span>
    </div>
    <h1>We live here and <b>it rotates</b>.</h1>
    <p class="intro">Interactive demonstrations for arguing about the shape of the Earth.
    Each one runs in your browser and is built to be screenshared mid conversation:
    open it, drive it, and let the geometry do the talking.</p>
  </header>

  <main id="apps" aria-label="Tools">
    <noscript><p class="note">This page lists tools from a manifest and needs JavaScript.
    The direct links: <a href="https://icspin.github.io/compare-earfs/">Solterm</a>.</p></noscript>
  </main>

  <footer>
    <a href="https://github.com/icspin">github.com/icspin</a>
    <span>static page, rendered from <span class="mono">apps.json</span></span>
  </footer>
</div>

<script>
(function(){
  'use strict';
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function card(app){
    var live = app.status === 'live' && app.url;
    var el = document.createElement(live ? 'a' : 'div');
    el.className = 'card' + (live ? '' : ' soon');
    if (live) el.href = app.url;
    var img = live && app.image
      ? '<img class="shot" src="' + esc(app.image) + '" alt="Screenshot of ' + esc(app.name) + '" loading="lazy">'
      : '';
    var badge = live
      ? (app.build != null ? '<span class="build mono">build ' + esc(app.build) + '</span>' : '')
      : '<span class="build mono">in progress</span>';
    el.innerHTML = img +
      '<div class="body">' +
        '<div class="top">' +
          '<span class="dot" style="background:' + esc(app.accent || '#b8892e') + '"></span>' +
          '<span class="name">' + esc(app.name) + '</span>' + badge +
        '</div>' +
        '<p class="tagline">' + esc(app.tagline) + '</p>' +
        (live ? '<div class="go">open &rsaquo;</div>' : '') +
      '</div>';
    return el;
  }
  fetch('apps.json?v=' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function(list){
      if (!Array.isArray(list)) return;
      var main = document.getElementById('apps');
      list.forEach(function(app){ if (app && app.name) main.appendChild(card(app)); });
    })
    .catch(function(){
      var main = document.getElementById('apps');
      var p = document.createElement('p');
      p.className = 'note';
      p.innerHTML = 'Could not load the tool list. It lives at ' +
        '<a href="https://github.com/icspin">github.com/icspin</a>.';
      main.appendChild(p);
    });
})();
</script>
</body>
</html>
